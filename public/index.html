<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSockets</title>
    <style>
        body {
            background-color: #000000;
            font-family: Arial, sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .room-controls, .message-controls {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #333;
            border-radius: 5px;
        }
        input, button {
            margin: 5px;
            padding: 10px;
            border-radius: 5px;
        }
        input {
            width: 200px;
            border: 1px solid #ccc;
        }
        button {
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status {
            margin-top: 10px;
            color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="room-controls">
            <h3>Room Controls</h3>
            <input type="text" id="roomCode" placeholder="Enter room code">
            <button id="joinRoom">Join Room</button>
            <button id="createRoom">Create New Room</button>
            <div id="status"></div>
        </div>
    </div>

    
   <script>
        const status = document.getElementById('status');

        // Room Creation
        document.getElementById('createRoom').addEventListener('click', () => {
                fetch('/room')
                    .then(response => response.json())
                    .then(data => {
                        document.getElementById('roomCode').value = data.roomCode;
                        status.textContent = `Room created: ${data.roomCode}`;
                    })
                    .catch(err => {
                        status.textContent = 'Error creating room';
                        console.error(err);
                    });
            });
        
        document.getElementById('joinRoom').addEventListener('click',(e)=>{
            const roomCode = document.getElementById('roomCode').value;
            if (!roomCode) {
                status.textContent = 'Please enter a room code';
                return;
            }
            window.location.href = `/chat-room.html/${roomCode}`;
        })
   </script>
</body>
</html>
